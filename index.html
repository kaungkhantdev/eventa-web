<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventa · Event registration system</title>

    <!-- Theme bootstrap: runs before paint so a dark reload never flashes light -->
    <script>
      try {
        var t = localStorage.getItem('eventa-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme:dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Hugeicons via <link> (not a CSS @import): the font's @font-face uses
         RELATIVE urls, which only resolve against the CDN when linked directly.
         Its `.hgi-stroke { position: relative }` is neutralised for absolute
         icons by a targeted rule in src/styles/tokens.css. -->
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
  </head>
  <body class="h-full bg-canvas font-sans text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
